name: Auto YouTube Football Shorts Bot

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan setiap hari
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-football-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install moviepy requests google-generativeai pillow edge-tts

      - name: Jalankan Bot Sepak Bola
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python youtube_shorts_bot.py
