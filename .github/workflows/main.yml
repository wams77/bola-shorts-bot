name: Auto Motivasi Shorts Bot

on:
  schedule:
    # Berjalan otomatis setiap hari pada pukul 09:30 UTC 
    # (Sama dengan pukul 16:30 WIB / 17:30 WITA / 18:30 WIT)
    - cron: '30 9 * * *'
  workflow_dispatch: # Memungkinkan Anda menekan tombol "Run workflow" secara manual kapan saja

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Eksekusi Bot Utama (Batch 5 Video)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python bot.py
