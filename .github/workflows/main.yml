name: Auto Motivasi Shorts Bot

on:
  schedule:
    - cron: '30 9 * * *' # Berjalan otomatis pukul 16:30 WIB setiap hari
  workflow_dispatch: # Memunculkan tombol "Run workflow" untuk eksekusi manual

# Memberikan izin kepada bot untuk menulis/mengubah file history di repositori
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mesin Grafis (ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # Memperbaiki kebijakan ImageMagick agar MoviePy bisa merender teks dengan rapi
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # PERBAIKAN 1: Menambahkan google-generativeai dan pillow di sini
          pip install edge-tts moviepy requests google-api-python-client google-auth-oauthlib google-auth-httplib2 google-generativeai pillow

      - name: Eksekusi Bot Produksi
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # PERBAIKAN 2: Menambahkan kunci akses Gemini AI
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py

      - name: Simpan Memori Bot (Anti-Duplikasi)
        run: |
          git config --global user.name 'Bot Editor AI'
          git config --global user.email 'bot@actions.github.com'
          
          # PERBAIKAN 3: Menyesuaikan nama file dengan script Python yang baru (history_hooks.txt)
          touch history_hooks.txt 
          
          git add history_hooks.txt
          # Hanya commit jika ada perubahan
          git diff --quiet && git diff --staged --quiet || git commit -m "update memori video AI"
          git push
