name: Auto Football Shorts Bot

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Deno (untuk yt-dlp)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Buat File Cookies
        # Menyalin isi token rahasia ke file lokal cookies.txt di server
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Instal yt-dlp versi paling mutakhir (Nightly/Master) langsung dari GitHub
          pip install --force-reinstall https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz

      - name: Eksekusi Bot Utama
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python bot.py
