name: Auto Motivasi Shorts Bot

on:
  schedule:
    # Berjalan 3 kali sehari: 
    # 1. Jam 07:00 WITA (23:00 UTC)
    # 2. Jam 12:00 WITA (04:00 UTC)
    # 3. Jam 18:00 WITA (10:00 UTC)
    - cron: '0 23,4,10 * * *'
  workflow_dispatch: # Memunculkan tombol "Run workflow" untuk eksekusi manual

# Memberikan izin kepada bot untuk menulis/mengubah file history di repositori
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mesin Grafis & Video (ImageMagick & FFmpeg)
        run: |
          sudo apt-get update
          # Menambahkan ffmpeg agar pemrosesan video Pexels berjalan mulus
          sudo apt-get install -y imagemagick ffmpeg
          # Memperbaiki kebijakan ImageMagick agar MoviePy bisa merender teks dengan rapi
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Mematok moviepy ke versi 1.0.3 agar kompatibel dengan modul import lama
          pip install moviepy==1.0.3 edge-tts requests google-api-python-client google-auth-oauthlib google-auth-httplib2 groq pillow

      - name: Eksekusi Bot Produksi
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Menambahkan PEXELS_API_KEY agar bot bisa mendownload video latar
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python bot.py

      - name: Simpan Memori Bot (Anti-Duplikasi)
        run: |
          git config --global user.name 'Bot Editor AI'
          git config --global user.email 'bot@actions.github.com'
          
          # Memastikan file history.txt ada di repository
          touch history.txt 
          
          git add history.txt
          
          # Hanya commit & push jika ada perubahan pada history.txt, jika tidak ada lewati dengan aman
          git diff --quiet && git diff --staged --quiet || (git commit -m "update memori video Stoic" && git push)
